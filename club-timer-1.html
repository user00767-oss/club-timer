<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Timer</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--tx:#1a1a1a;--mut:#777;--ln:#2b4bd6;--go:#1f9d55;--stop:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#232323;--tx:#eee;--mut:#999;--ln:#7d94ff}}
:root[data-theme="dark"]{--bg:#161616;--card:#232323;--tx:#eee;--mut:#999;--ln:#7d94ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 6px}
.top b{font-size:14px}
.clr{border:0;background:var(--stop);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.grid{flex:1;display:flex;direction:ltr;gap:3px;padding:0 3px 6px;min-height:0}
.col{flex:1;min-width:0;background:var(--card);border-radius:8px;display:flex;flex-direction:column}
.col h2{margin:0;padding:8px 0 6px;font-size:12px;text-align:center;border-bottom:2px solid var(--ln)}
.list{flex:1;overflow-y:auto;padding:0 2px}
.en{border-bottom:1.5px solid var(--ln);padding:4px 1px;font-size:11px;direction:ltr;position:relative}
.en .n{color:var(--mut);font-weight:700}
.en .t{font-size:12px;font-weight:600}
.en .p{font-size:13px;font-weight:700;color:var(--go);margin-top:2px}
.en input{width:100%;font-size:10px;border:1px solid var(--mut);border-radius:4px;padding:2px;background:transparent;color:var(--tx);margin-top:2px;direction:rtl}
.x{position:absolute;top:2px;right:0;border:0;background:none;color:var(--mut);font-size:13px;padding:0 3px}
.btn{margin:4px;border:0;border-radius:8px;padding:12px 0;font-size:13px;font-weight:700;color:#fff;background:var(--go)}
.btn.run{background:var(--stop)}
</style>
</head>
<body>
<div class="top"><b>ثبت زمان</b><button class="clr" id="clr">پاک کردن روز</button></div>
<div class="grid" id="grid"></div>
<script>
var COLS=[["ps4b","PS4 (2)",80],["ps4a","PS4 (1)",80],["ps5","PS5",100],["snk","Snooker",120],["bil","Billiard",100]];
function cost(e,r){var a=e.s.split(":"),b=e.e.split(":");var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(m<0)m+=1440;return Math.round(m/60*r)}
var KEY="club-timer-v1",S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function now(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function render(){
  var g=document.getElementById("grid");g.innerHTML="";
  COLS.forEach(function(c){
    var id=c[0],L=S[id]||(S[id]=[]);
    var col=document.createElement("div");col.className="col";
    var h=document.createElement("h2");h.textContent=c[1];col.appendChild(h);
    var list=document.createElement("div");list.className="list";
    L.forEach(function(e,i){
      var d=document.createElement("div");d.className="en";
      d.innerHTML='<span class="n">'+(i+1)+'</span><div class="t">'+e.s+'</div><div class="t">'+(e.e||"...")+'</div>'+(e.e?'<div class="p">'+cost(e,c[2])+'</div>':'');
      var inp=document.createElement("input");inp.placeholder="یادداشت";inp.value=e.n||"";
      inp.oninput=function(){e.n=inp.value;save()};d.appendChild(inp);
      var x=document.createElement("button");x.className="x";x.textContent="×";
      x.onclick=function(){L.splice(i,1);save();render()};d.appendChild(x);
      list.appendChild(d);
    });
    col.appendChild(list);
    var run=L.length&&!L[L.length-1].e;
    var b=document.createElement("button");b.className="btn"+(run?" run":"");b.textContent=run?"پایان":"شروع";
    b.onclick=function(){
      if(run){L[L.length-1].e=now()}else{L.push({s:now(),e:"",n:""})}
      save();render();
    };
    col.appendChild(b);g.appendChild(col);
  });
}
var clr=document.getElementById("clr"),tm;
clr.onclick=function(){
  if(clr.dataset.sure){S={};save();render();clr.textContent="پاک کردن روز";delete clr.dataset.sure;clearTimeout(tm);return}
  clr.dataset.sure=1;clr.textContent="مطمئنی؟ دوباره بزن";
  tm=setTimeout(function(){clr.textContent="پاک کردن روز";delete clr.dataset.sure},4000);
};
render();
</script>
</body>
</html>
